<script>
'use strict';
const DATA={"questions":[{"n":1,"choices":["traditionally","tradition","traditional","traditionality"],"answer":"C","explain":"Trước danh từ “metrics” cần tính từ “traditional” (những thước đo truyền thống).","evidence":"goes beyond (1)_____ metrics like wealth and status"},{"n":2,"choices":["business strategies innovative","strategies business innovative","innovative strategies business","innovative business strategies"],"answer":"D","explain":"Trật tự cụm danh từ: tính từ “innovative” + danh từ bổ nghĩa “business” + danh từ chính “strategies”.","evidence":"Our (2)_____ are transforming global industries"},{"n":3,"choices":["was shattered","shattering","which shattered","shattered"],"answer":"B","explain":"Cụm phân từ hiện tại “shattering limits” bổ sung hành động đang thực hiện của “individuals”, song song với “inspiring”.","evidence":"Meet extraordinary individuals, (3)_____ limits and inspiring others"},{"n":4,"choices":["to","for","with","about"],"answer":"A","explain":"Cấu trúc “offer something to somebody” (mang lại/chia sẻ điều gì cho ai).","evidence":"offer their expertise (4)_____ young entrepreneurs"},{"n":5,"choices":["push","fold","address","seal"],"answer":"A","explain":"Thành ngữ “push the envelope” = vượt qua giới hạn hiện có, tìm ra điều mới.","evidence":"they (5)_____ the envelope of possibilities"},{"n":6,"choices":["embracing","to embrace","to embracing","embrace"],"answer":"B","explain":"Cấu trúc “inspire somebody to do something”: truyền cảm hứng cho ai làm gì.","evidence":"They inspire others (6)_____ transformative change"},{"n":7,"choices":["the others","others","another","other"],"answer":"B","explain":"“Others” đứng độc lập để chỉ những người khác; “other” cần danh từ theo sau.","evidence":"(7)_____ persist through challenges"},{"n":8,"choices":["give up on","back down from","shy away from","move on from"],"answer":"A","explain":"“give up on their dreams” là từ bỏ ước mơ; ngữ cảnh nói người thành công không từ bỏ mục tiêu.","evidence":"successful people never (8)_____ their ambitious dreams"},{"n":9,"choices":["persistence","determination","resilience","adaptability"],"answer":"C","explain":"“Resilience” là khả năng phục hồi/vượt qua nghịch cảnh; phù hợp với “difficult times and unexpected setbacks”.","evidence":"Their (9)_____ in difficult times and unexpected setbacks"},{"n":10,"choices":["According to","On account of","In spite of","Independent of"],"answer":"C","explain":"“In spite of + noun phrase” nghĩa là bất chấp, thể hiện quan hệ tương phản với “they kept moving forward”.","evidence":"(10)_____ all challenges and numerous obstacles ... they kept moving forward"},{"n":11,"choices":["challenges","obstacles","setbacks","failures"],"answer":"D","explain":"“Through countless failures” nhấn mạnh kiên trì dù thất bại. Tuy vậy, các phương án A/B/C cũng có thể kết hợp tự nhiên với “countless”: câu chưa đủ điều kiện phân biệt tuyệt đối.","evidence":"unwavering determination through countless (11)_____"},{"n":12,"choices":["majority","handful","number","lot"],"answer":"C","explain":"“A number of + plural noun” = một số/nhiều người. Lưu ý “a lot of” và “a handful of” cũng đúng ngữ pháp; đề gốc thiếu ngữ cảnh để xác định duy nhất một đáp án.","evidence":"A (12)_____ of successful people ... started from humble beginnings"},{"n":13,"choices":["a-c-b","b-a-c","a-b-c","c-b-a"],"answer":"D","explain":"Alex mở lời mời ăn tối (c), Jordan đồng ý và hỏi về cà chua (b), Alex trả lời “They are good” và đề nghị mang máy lọc nước (a).","evidence":"c → b → a"},{"n":14,"choices":["c-b-d-e-a","a-b-c-d-e","c-a-e-b-d","d-e-b-c-a"],"answer":"A","explain":"Mở đầu bằng đồng hồ của Sam (c); Taylor phản hồi và nói về giày (b); Sam hỏi thử giày (d); Taylor đồng ý rồi hỏi về cây (e); Sam trả lời (a).","evidence":"c → b → d → e → a"},{"n":15,"choices":["c-e-a-d-b","d-a-e-c-b","e-b-a-d-c","a-d-c-e-b"],"answer":"A","explain":"Thư: lời chào hỏi (c) → giới thiệu thay đổi trong cuộc sống (e) → quá trình học lập trình (a) → kết quả có việc mới (d) → lời suy ngẫm, cảm ơn Maria (b).","evidence":"c → e → a → d → b"},{"n":16,"choices":["a-b-c-e-d","b-a-e-c-d","c-a-b-e-d","e-b-a-c-d"],"answer":"B","explain":"Mở đầu nhận định chung về mất mát (b) → ví dụ Tom (a) → ví dụ Sarah (e) → quá trình xây dựng lại (c) → kết luận tích cực (d).","evidence":"b → a → e → c → d"},{"n":17,"choices":["b-a-c-d-e","b-e-c-d-a","b-d-a-e-c","b-c-d-e-a"],"answer":"D","explain":"Giới thiệu những người có tầm nhìn (b) → ví dụ Steve Jobs (c) → khó khăn chung (d) → Edison minh họa sự kiên trì (e) → kết luận (a).","evidence":"b → c → d → e → a"},{"n":18,"choices":["guided that crucial actions will affect psychological responses","which suggests that minor changes can lead to significant outcomes","confirms people achieved success through detailed approaches","where implies exact research creates fundamental societal values"],"answer":"B","explain":"Mệnh đề quan hệ “which suggests ...” giải thích hiệu ứng cánh bướm và thống nhất nội dung câu.","evidence":"The butterfly effect ... perfectly illustrates how personal decisions ripple outward"},{"n":19,"choices":["furthermore, the environment creates challenges for future generations","similarly, each expert develops systems with mathematical precision","therefore, all innovations require resources beyond initial investments","moreover, they establish precedents that others may follow"],"answer":"D","explain":"“They” quy chiếu về các hành động/quyết định, từ đó tạo tiền lệ để người khác làm theo; các đáp án khác chuyển chủ đề.","evidence":"the actions we take today ... determine the world that future generations will inherit"},{"n":20,"choices":["which rapidly grows across their planned limits and creates identical ventures elsewhere","that steadily developing through initial boundaries yet produce related works elsewhere","often expand beyond their original scope and inspire similar projects elsewhere","having achieve outside their intended range then generate parallel tasks elsewhere"],"answer":"C","explain":"Chủ ngữ số nhiều “Small initiatives” đi với “often expand”; nội dung đúng mạch ảnh hưởng lan rộng và truyền cảm hứng.","evidence":"Small initiatives, such as neighborhood clean-ups or community gardens"},{"n":21,"choices":["Recognizing our capacity for impact but rejecting responsibility for our choices prevents us from becoming agents of positive change","Accepting responsibility for our choices without recognizing our capacity for impact limits our ability to create meaningful positive change","Becoming agents of positive change requires neither recognizing our capacity for impact nor accepting responsibility for our personal choices","Recognizing our capacity for impact and accepting responsibility for our choices empowers us to become agents of positive change"],"answer":"D","explain":"Câu D khẳng định đồng thời nhận thức tác động và trách nhiệm với lựa chọn, phù hợp thông điệp tích cực của đoạn.","evidence":"These ripples of change continue to spread outward"},{"n":22,"choices":["we can intentionally create waves of positive transformation resonating far beyond our immediate sphere of influence","we can accidentally generate ripples of negative disruption having spread rapidly throughout our extended network of connections","we can passively observe currents of social change being created by others without contributing our unique perspective or talents","we can reluctantly accept limitations of personal impact restricting our ability to affect meaningful change beyond our closest relationships"],"answer":"A","explain":"Ý nối trực tiếp với khả năng nhận thức sự liên kết giữa hành động và tác động tích cực vượt phạm vi gần.","evidence":"By acknowledging the interconnectedness of our actions"},{"n":23,"choices":["Lack of technical expertise","Limited funding from investors","Public skepticism about new technologies","Varying government regulations"],"answer":"A","explain":"Đoạn 3 nhắc thiếu vốn, quy định của chính phủ, sự hoài nghi của công chúng; không nhắc thiếu chuyên môn kỹ thuật.","evidence":"Limited funding remains a persistent challenge ... Government regulations ... public skepticism"},{"n":24,"choices":["exceptional","noteworthy","ordinary","outstanding"],"answer":"C","explain":"“Remarkable” = đáng chú ý/nổi bật; trái nghĩa là “ordinary” (bình thường).","evidence":"remarkable solutions"},{"n":25,"choices":["modern","experimental","innovative","traditional"],"answer":"D","explain":"“Conventional” = truyền thống, thông thường; thay bằng “traditional” trong ngữ cảnh phương pháp canh tác.","evidence":"conventional methods"},{"n":26,"choices":["countries","government regulations","innovations","green innovators"],"answer":"D","explain":"“Despite their promising work, green innovators face ...” → “their” chỉ “green innovators”.","evidence":"Despite their promising work, green innovators face significant obstacles"},{"n":27,"choices":["Innovations in sustainability are anticipated to increase speed as global warming fears escalate.","Climate change awareness will probably drive rapid advances in sustainable solutions during future decades.","Environmental technologies may develop more quickly in subsequent decades because of heightened climate anxiety.","Future years are expected to see faster development of eco-friendly technologies due to growing environmental worries."],"answer":"D","explain":"Đáp án D diễn đạt sát nhất “coming decades ... acceleration of green innovation ... climate concerns intensify”. Một số phương án còn lại khá gần nghĩa nhưng lệch sắc thái.","evidence":"The coming decades will likely witness an acceleration of green innovation as climate concerns intensify."},{"n":28,"choices":["Vertical farming techniques use ninety-five percent less water than traditional agricultural methods.","Government regulations for environmental innovation remain uniform across different countries worldwide.","Investors are consistently eager to support green projects despite their extended development timelines.","Public skepticism about environmental technologies has completely stopped their widespread adoption."],"answer":"A","explain":"Đoạn 2 nêu canh tác thẳng đứng giảm 95% lượng nước; B/C/D đối lập nội dung đoạn 3.","evidence":"vertical farming techniques allow crops to grow in urban environments using 95% less water than conventional methods"},{"n":29,"choices":["Paragraph 2","Paragraph 1","Paragraph 3","Paragraph 4"],"answer":"A","explain":"Đoạn 2 liệt kê thiết bị năng lượng mặt trời, tái chế, canh tác thẳng đứng, phương tiện đi lại.","evidence":"Solar-powered devices ... advanced recycling systems ... vertical farming ... electric vehicles"},{"n":30,"choices":["Paragraph 1","Paragraph 4","Paragraph 2","Paragraph 3"],"answer":"B","explain":"Đoạn 4 dự báo triển vọng tăng tốc và đề cập đầu tư, thay đổi chính sách, lựa chọn cá nhân làm động lực hỗ trợ.","evidence":"The coming decades will likely witness an acceleration of green innovation"},{"n":31,"choices":["preserving","exchanging","withholding","distributing"],"answer":"C","explain":"“Transmitting” = truyền đạt/trao truyền; “withholding” = giữ lại, không cung cấp, là nghĩa đối lập.","evidence":"transmitting cultural knowledge to future generations"},{"n":32,"choices":["looking into","giving up on","treading between","running through"],"answer":"C","explain":"“Walking a tightrope between A and B” = cân bằng khó khăn giữa hai yêu cầu; C gần ý nhất. Lưu ý đề gốc ghi “paragraph 3” nhưng cụm từ thực nằm ở đoạn 2.","evidence":"walking a tightrope between maintaining authenticity and embracing change"},{"n":33,"choices":["[I]","[II]","[III]","[IV]"],"answer":"D","explain":"Đặt cuối đoạn 2 [IV] để bổ sung một mối đe dọa khác sau đô thị hóa/toàn cầu hóa, trước phần giải pháp.","evidence":"Additionally, urbanization and globalization have led to the gradual disappearance of traditional practices"},{"n":34,"choices":["Limited funding for cultural preservation programs","Disconnection of younger generations from their cultural roots","Risk of indigenous languages becoming extinct","Disappearance of traditional practices due to urbanization"],"answer":"A","explain":"B và D được nêu trực tiếp; mối đe dọa ngôn ngữ biến mất cũng phù hợp nội dung mở đầu. “Limited funding” không có trong bài. Lưu ý C được nêu trực tiếp ở câu chèn của câu 33, không phải đoạn văn gốc trước khi chèn.","evidence":"younger generations becoming disconnected from their roots ... gradual disappearance of traditional practices"},{"n":35,"choices":["Traditional methods remain the primary solution for protecting cultural legacy","Modern technological approaches are successfully enhancing heritage conservation efforts","Technological advancements create new obstacles for cultural documentation","Social media platforms dominate efforts to revive outdated traditions"],"answer":"B","explain":"Đoạn 3 nhấn mạnh lưu trữ số, bảo tàng ảo, giáo dục văn hóa và mạng xã hội hỗ trợ bảo tồn di sản.","evidence":"technology can support rather than hinder cultural preservation"},{"n":36,"choices":["communities","cultural keepers","young people","schools"],"answer":"C","explain":"Trong “ensuring young people maintain connections with their heritage”, “their” thay cho “young people”.","evidence":"ensuring young people maintain connections with their heritage"},{"n":37,"choices":["Technological advancements alone will determine the survival of cultural traditions","Maintaining cultural identity depends entirely on strict adherence to traditional methods","Successful heritage conservation requires harmonizing historical practices with modern adaptations","Effective preservation prioritizes community participation over methodological choices"],"answer":"C","explain":"“Finding the right balance between tradition and innovation” = hài hòa truyền thống với phương pháp/đổi mới hiện đại.","evidence":"The future of cultural preservation lies in finding the right balance between tradition and innovation."},{"n":38,"choices":["Digital tools and traditional practices can work together to preserve heritage","Modern technology serves exclusively as a threat to traditional cultural preservation","Communities must choose between maintaining tradition or embracing innovation","Social media platforms have replaced traditional methods of cultural transmission"],"answer":"A","explain":"Đoạn 3 nói công cụ hiện đại có thể hỗ trợ các thực hành văn hóa truyền thống.","evidence":"This integration of modern tools with traditional practices demonstrates how technology can support rather than hinder cultural preservation."},{"n":39,"choices":["Digital technology will eventually replace all traditional preservation methods","Passive preservation strategies alone will likely fail to protect cultural heritage","Urban communities value cultural traditions more than rural populations do","Young people prefer modern approaches over maintaining cultural practices"],"answer":"B","explain":"Bài nhấn mạnh các cộng đồng cần chủ động tham gia và kết hợp các biện pháp, nên bảo tồn thụ động khó đủ hiệu quả.","evidence":"cultural heritage can thrive when communities actively participate in its preservation"},{"n":40,"choices":["Modern technology and urbanization pose significant threats to the survival of traditional cultural practices worldwide","Digital tools and social media platforms have revolutionized the way communities preserve their cultural heritage","Educational programs in schools are essential for transmitting cultural knowledge to younger generations effectively","Cultural preservation requires balancing traditional methods with modern innovations while ensuring active community engagement"],"answer":"D","explain":"D bao quát đồng thời thách thức, sự kết hợp truyền thống–đổi mới và vai trò chủ động của cộng đồng; các lựa chọn còn lại chỉ là ý bộ phận.","evidence":"The future of cultural preservation lies in finding the right balance between tradition and innovation."}],"sections":[{"slug":"ad","title":"Beyond Boundaries: Stories of Those Redefining Success","intro":"Read the following advertisement and mark the letter A, B, C or D on your answer sheet to indicate the option that best fits each of the numbered blanks from 1 to 6.","paras":[["The redefinition of success goes beyond (1)________ metrics like wealth and status. Our (2)________ are transforming global industries at unprecedented speeds.","Việc định nghĩa lại thành công vượt ra ngoài những thước đo truyền thống như sự giàu có và địa vị. Các chiến lược kinh doanh đổi mới của chúng tôi đang chuyển đổi các ngành công nghiệp toàn cầu với tốc độ chưa từng có."],["Meet extraordinary individuals, (3)________ limits and inspiring others worldwide through their journeys. These pioneers offer their expertise (4)________ young entrepreneurs with great enthusiasm.","Hãy gặp những con người phi thường đang phá vỡ giới hạn và truyền cảm hứng cho mọi người trên thế giới qua hành trình của họ. Những người tiên phong ấy nhiệt tình chia sẻ chuyên môn cho các doanh nhân trẻ."],["Every day, they (5)________ the envelope of possibilities in cutting-edge technological fields. They inspire others (6)________ transformative change and challenge outdated conventions.","Mỗi ngày họ mở rộng giới hạn khả năng trong những lĩnh vực công nghệ tiên tiến. Họ truyền cảm hứng để người khác đón nhận những thay đổi mang tính chuyển đổi và thách thức các quy ước lạc hậu."]],"start":1,"end":6,"label":"ADVERTISEMENT"},{"slug":"leaflet","title":"Defying Odds: Life Stories That Challenge the Impossible","intro":"Read of the following leaflet and mark the letter A, B, C or D on your answer sheet to indicate the option that best fits each of the numbered blanks from 7 to 12.","paras":[["While some people give up easily in their daily struggles, (7)________ persist through challenges with remarkable determination. When facing difficulties in their personal and professional lives, successful people never (8)________ their ambitious dreams and meaningful goals.","Trong khi một số người dễ dàng bỏ cuộc trước khó khăn thường ngày, những người khác kiên trì vượt qua thử thách với quyết tâm đáng kinh ngạc. Khi gặp khó khăn trong cuộc sống và công việc, người thành công không từ bỏ ước mơ và mục tiêu đầy ý nghĩa của mình."],["Their (9)________ in difficult times and unexpected setbacks sets them apart. (10)________ all challenges and numerous obstacles along the way, they kept moving forward.","Khả năng phục hồi trước giai đoạn khó khăn và những trở ngại bất ngờ giúp họ khác biệt. Bất chấp thử thách và rất nhiều trở ngại, họ vẫn tiếp tục tiến lên."],["Their unwavering determination through countless (11)________ became their greatest strength. A (12)________ of successful people from various backgrounds and different cultures started from humble beginnings.","Quyết tâm không lay chuyển sau vô số thất bại trở thành sức mạnh lớn nhất của họ. Nhiều người thành công đến từ những hoàn cảnh và nền văn hóa khác nhau đã bắt đầu từ xuất phát điểm khiêm tốn."],["Join us for an inspiring evening of remarkable stories that will change your perspective on what's possible.","Hãy tham dự một buổi tối đầy cảm hứng với những câu chuyện đáng nhớ sẽ thay đổi góc nhìn của bạn về những điều có thể đạt được."]],"start":7,"end":12,"label":"LEAFLET"},{"slug":"order","title":"Sentence Arrangement","intro":"Mark the letter A, B, C or D on your answer sheet to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text in each of the following questions from 13 to 17.","paras":[],"start":13,"end":17,"label":"ARRANGEMENT"},{"slug":"small-actions","title":"Small Actions with Enormous Impact","intro":"Read the following passage about Small Actions with Enormous Impact and mark the letter A, B, C or D on your answer sheet to indicate the option that best fits each of the numbered blanks from 18 to 22.","paras":[["In our interconnected world, small actions can create profound reverberations that transform communities and inspire global movements. Many ordinary people, having witnessed injustice or environmental degradation, have decided to take meaningful action in their communities. The butterfly effect, (18)________, perfectly illustrates how personal decisions ripple outward with unexpected consequences. The actions we take today not only affect our immediate surroundings but also determine the world that future generations will inherit; (19)________.","Trong thế giới kết nối, hành động nhỏ có thể tạo tác động sâu rộng, thay đổi cộng đồng và truyền cảm hứng cho các phong trào toàn cầu. Nhiều người bình thường, chứng kiến bất công hoặc suy thoái môi trường, đã hành động có ý nghĩa trong cộng đồng. Hiệu ứng cánh bướm cho thấy quyết định cá nhân có thể lan rộng với hậu quả bất ngờ. Hành động hôm nay ảnh hưởng không chỉ đến môi trường gần chúng ta mà cả thế giới thế hệ tương lai thừa hưởng."],["Small initiatives, such as neighborhood clean-ups or community gardens, (20)________. Had the environmental activists not raised their voices decades ago, our planet would be facing even more severe climate challenges today. Every individual contribution, no matter how small, becomes part of a larger tapestry of positive change that spans across borders and generations. Nature, which has always been resilient, now requires our conscious protection to thrive in the modern era.","Những sáng kiến nhỏ như dọn vệ sinh khu phố hoặc vườn cộng đồng có thể phát triển vượt quy mô ban đầu và truyền cảm hứng cho các dự án khác. Nếu các nhà hoạt động môi trường không lên tiếng từ nhiều thập kỷ trước, hành tinh có thể đang đối diện với thách thức khí hậu nghiêm trọng hơn. Mỗi đóng góp nhỏ đều góp phần vào sự thay đổi tích cực rộng khắp các thế hệ. Thiên nhiên ngày nay cần sự bảo vệ có ý thức."],["(21)________. These ripples of change continue to spread outward, touching lives and transforming perspectives along the way. By acknowledging the interconnectedness of our actions, (22)________. Research consistently shows that acts of kindness trigger a cascade effect, inspiring others to replicate these positive behaviors in their own communities. Even modest environmental practices like reducing plastic usage or conserving water can collectively lead to substantial ecological benefits when adopted widely.","Khi nhận thức được sức ảnh hưởng của mình và chịu trách nhiệm với lựa chọn, chúng ta được trao quyền tạo thay đổi tích cực. Những làn sóng thay đổi tiếp tục lan xa và tác động đến con người. Khi thừa nhận các hành động có liên hệ với nhau, chúng ta có thể chủ động tạo làn sóng chuyển đổi tích cực. Nghiên cứu cho thấy hành động tử tế tạo hiệu ứng dây chuyền; ngay cả giảm nhựa hay tiết kiệm nước cũng đem lại lợi ích sinh thái đáng kể nếu áp dụng rộng rãi."]],"start":18,"end":22,"label":"PASSAGE COMPLETION"},{"slug":"climate","title":"Solving Climate Challenges with Creativity","intro":"Read the following passage about Solving Climate Challenges with Creativity and mark the letter A, B, C or D on your answer sheet to indicate the best answer to each of the following questions from 23 to 30.","paras":[["Climate change represents one of the greatest challenges of our time, threatening ecosystems and communities worldwide. Fortunately, a new generation of creative problem-solvers, known as green innovators, is developing <u>remarkable<\/u> solutions to address these urgent environmental issues. These individuals combine scientific knowledge with creative thinking to design technologies that reduce carbon emissions, conserve natural resources, and promote sustainable living. Unlike traditional approaches that often prioritize short-term economic gains, these innovators focus on long-term environmental sustainability.","Biến đổi khí hậu là một trong những thách thức lớn nhất thời đại, đe dọa các hệ sinh thái và cộng đồng. Thế hệ nhà đổi mới sáng tạo xanh đang phát triển giải pháp đáng chú ý. Họ kết hợp khoa học và tư duy sáng tạo để giảm phát thải carbon, bảo tồn tài nguyên và thúc đẩy lối sống bền vững, chú trọng tính bền vững lâu dài thay vì lợi ích ngắn hạn."],["Many impressive examples of green innovation have emerged in recent years. Solar-powered devices now capture energy even on cloudy days, while advanced recycling systems transform plastic waste into valuable construction materials. In agriculture, vertical farming techniques allow crops to grow in urban environments using 95% less water than <u>conventional<\/u> methods. Additionally, innovative transportation solutions include electric vehicles powered by renewable energy and bicycles made from sustainable bamboo. These creative approaches demonstrate how human ingenuity can tackle seemingly insurmountable environmental problems.","Đã có nhiều ví dụ ấn tượng về đổi mới xanh. Thiết bị dùng năng lượng mặt trời hoạt động cả ngày nhiều mây; hệ thống tái chế chuyển rác nhựa thành vật liệu xây dựng. Canh tác thẳng đứng trong đô thị sử dụng ít nước hơn 95% so với phương pháp thông thường. Xe điện dùng năng lượng tái tạo và xe đạp bằng tre bền vững cũng là giải pháp. Các cách tiếp cận này cho thấy khả năng sáng tạo giải quyết vấn đề môi trường khó khăn."],["Despite their promising work, green innovators face significant obstacles. Limited funding remains a persistent challenge, as investors sometimes hesitate to support projects with longer development timelines. Government regulations, which vary greatly between countries, can either help or hinder innovation depending on their implementation. Furthermore, public skepticism about new technologies occasionally slows adoption rates, even when these solutions prove effective.","Dù có nhiều tiềm năng, các nhà đổi mới xanh gặp trở ngại đáng kể. Thiếu vốn là thách thức lâu dài do nhà đầu tư ngần ngại với dự án phát triển lâu. Quy định chính phủ khác nhau giữa các quốc gia có thể hỗ trợ hoặc cản trở đổi mới. Sự hoài nghi của công chúng đôi khi khiến công nghệ được chấp nhận chậm hơn dù hiệu quả."],["<u><strong>The coming decades will likely witness an acceleration of green innovation as climate concerns intensify.<\/strong><\/u> Educational institutions increasingly incorporate sustainability into their curricula, preparing students to develop the next generation of environmental solutions. Meanwhile, consumers are becoming more environmentally conscious, creating growing markets for sustainable products and services. By supporting these creative problem-solvers through investment, policy changes, and personal choices, we can all contribute to a greener, more sustainable world.","Những thập kỷ tới có khả năng chứng kiến sự tăng tốc đổi mới xanh khi mối lo khí hậu gia tăng. Cơ sở giáo dục đưa phát triển bền vững vào chương trình đào tạo; người tiêu dùng ý thức hơn về môi trường, mở rộng thị trường xanh. Qua đầu tư, cải cách chính sách và lựa chọn cá nhân, mọi người có thể góp phần xây dựng một thế giới bền vững."]],"start":23,"end":30,"label":"READING COMPREHENSION"},{"slug":"heritage","title":"Preserving Heritage in a Changing World","intro":"Read the following passage about the Preserving Heritage in a Changing World and mark the letter A, B, C or D on your answer sheet to indicate the best answer to each of the following questions from 31 to 40.","paras":[["In today's rapidly evolving world, preserving cultural heritage has become increasingly important. Traditional customs, languages, and practices that have been passed down through generations face the risk of being forgotten in our modern society. Communities worldwide are recognizing the vital role of cultural keepers - individuals and organizations dedicated to protecting and <u>transmitting<\/u> cultural knowledge to future generations. This delicate balance between preservation and adaptation represents one of the most significant challenges of our time.","Trong thế giới thay đổi nhanh chóng, bảo tồn di sản văn hóa ngày càng quan trọng. Phong tục, ngôn ngữ và tập quán truyền qua nhiều thế hệ có nguy cơ bị lãng quên. Cộng đồng nhận ra vai trò của những người gìn giữ văn hóa — cá nhân, tổ chức bảo vệ và truyền đạt tri thức cho thế hệ tương lai. Cân bằng giữa bảo tồn và thích nghi là thách thức lớn."],["[I] Cultural keepers are <u>walking a tightrope<\/u> between maintaining authenticity and embracing change. [II] The digital age presents both opportunities and threats to cultural preservation. While technology offers new ways to document and share cultural practices, it also contributes to younger generations becoming disconnected from their roots. [III] Additionally, urbanization and globalization have led to the gradual disappearance of traditional practices, as people migrate to cities and adopt modern lifestyles. [IV]","Người giữ gìn văn hóa phải cân bằng khó khăn giữa tính nguyên bản và sự thay đổi. Kỷ nguyên số vừa đem lại cơ hội, vừa gây thách thức: công nghệ giúp ghi chép và chia sẻ tập quán nhưng cũng khiến giới trẻ xa rời cội nguồn. Đô thị hóa và toàn cầu hóa khiến một số thực hành truyền thống dần biến mất khi mọi người chuyển tới thành phố."],["Fortunately, innovative solutions are emerging to address these challenges. Digital archives and virtual museums are making cultural heritage more accessible than ever before. Many communities are implementing cultural education programs in schools, ensuring young people maintain connections with <strong>their<\/strong> heritage. Social media platforms have become unexpected allies, allowing cultural keepers to share traditional knowledge with wider audiences. This integration of modern tools with traditional practices demonstrates how technology can support rather than hinder cultural preservation.","May mắn là có nhiều giải pháp mới: kho lưu trữ số, bảo tàng ảo giúp di sản dễ tiếp cận; chương trình giáo dục văn hóa ở trường giúp người trẻ gắn kết với cội nguồn; mạng xã hội giúp chia sẻ tri thức tới đông đảo công chúng. Kết hợp công cụ hiện đại với thực hành truyền thống cho thấy công nghệ có thể hỗ trợ bảo tồn."],["<u><strong>The future of cultural preservation lies in finding the right balance between tradition and innovation.<\/strong><\/u> Success stories from around the world show that cultural heritage can thrive when communities actively participate in its preservation. By combining traditional wisdom with modern approaches, cultural keepers are ensuring that valuable customs and practices continue to enrich our global society. The key is to adapt while maintaining the essence of cultural identity, creating a bridge between past and future generations.","Tương lai bảo tồn di sản nằm ở sự cân bằng hợp lý giữa truyền thống và đổi mới. Các ví dụ thành công cho thấy di sản phát triển khi cộng đồng chủ động tham gia. Kết hợp tri thức truyền thống với cách tiếp cận mới sẽ giữ cho phong tục, tập quán tiếp tục làm giàu xã hội. Điều quan trọng là thích nghi mà vẫn giữ bản sắc, nối quá khứ và thế hệ tương lai."]],"start":31,"end":40,"label":"READING COMPREHENSION"}],"ordering":{"13":[["a","Alex: They are good! Can you bring your water machine? Mine is not working."],["b","Jordan: Yes, I do! I like your garden. How are your tomatoes?"],["c","Alex: Hello! Do you want to have dinner with me tonight? I have a new app for cooking."]],"14":[["a","Sam: Yes! They have lights at night and give free Wi-Fi."],["b","Taylor: Wow! That's cool. My shoes make energy when I walk."],["c","Sam: Look at my new smartwatch! It can clean water from the air."],["d","Sam: Really? Can I try them someday?"],["e","Taylor: Yes, of course. Oh, did you see the new trees in our city park?"]],"15":[["a","I started to learn computer programming online. It was hard at first because I am 45 years old and never used computers much before."],["b","Remember when you told me \"it's never too late to change\"? You were right! Sometimes bad things happen, but they can lead to new beginnings."],["c","How are you? I hope this letter finds you well."],["d","Today, I have a new job at a small tech company! My boss says I am a good worker. My children are proud of me."],["e","I wanted to tell you about my new life. After I lost my job last year, I was very sad. But now, everything is different!"]],"16":[["a","My friend Tom lost his house in a fire last year. He was very sad. His family moved to a small apartment. Slowly, they saved money and built a new home. It was hard work, but they did it together."],["b","Loss is a part of life. Sometimes we lose important things like our home, job, or someone we love. It feels like the end, but it is not."],["c","Rebuilding takes time. First, we must accept what happened. Then we can make small steps forward each day. We learn new skills and find new ways to be happy."],["d","Life after loss can be good again. Like a tree after winter, we can grow new leaves. We are stronger because we know we can survive hard times."],["e","When Sarah's husband left, she cried for many days. She felt alone and afraid. Then she joined a support group and made new friends. They helped her feel strong again."]],"17":[["a","We need visionaries to help us move forward. They show us what is possible when we think differently. Each of us can be a visionary if we are brave enough to follow our own ideas, even when others cannot see what we see."],["b","Some people can see the future before others. They have ideas that seem strange at first, but later change the world. We call these people visionaries."],["c","Steve Jobs believed computers could be for everyone, not just scientists. People laughed at his idea of a computer in every home. Today, most of us carry small computers in our pockets."],["d","Visionaries often face problems. People do not understand their ideas and say they will fail. But these special people believe in themselves and keep working hard."],["e","Thomas Edison made the light bulb when people thought it was impossible. Many said he was wasting his time. But he kept trying and after many failures, he succeeded. Now we cannot imagine life without electric light."]]},"prompts":{"23":"Which of the following is NOT mentioned as a challenge faced by green innovators?","24":"The word “<u>remarkable<\/u>” in paragraph 1 is OPPOSITE in meaning to ________.","25":"The word “<u>conventional<\/u>” in paragraph 2 could be best replaced by ________.","26":"The word “their” in paragraph 3 refers to ________.","27":"Which of the following best paraphrases the underlined sentence in paragraph 4?","28":"Which of the following is TRUE according to the passage?","29":"In which paragraph does the writer mention types of green innovations mentioned?","30":"In which paragraph does the writer mention the outlook for green innovation is positive if properly supported?","31":"The word “<u>transmitting<\/u>” in paragraph 1 is OPPOSITE in meaning to ________.","32":"The phrase “<u>walking a tightrope<\/u>” in paragraph 3 could be best replaced by ________.","33":"Where in paragraph 2 does the following sentence best fit?<div class=\"insert-statement\">Moreover, many indigenous languages are at risk of extinction.<\/div>","34":"Which of the following is NOT mentioned as a challenge to cultural preservation?","35":"Which of the following best summarises paragraph 3?","36":"The word “their” in paragraph 3 refers to ________.","37":"Which of the following best paraphrases the underlined sentence in paragraph 4?","38":"Which of the following is TRUE according to the passage?","39":"Which of the following can be inferred from the passage?","40":"Which of the following best summarises the passage?"},"vocab":{"redefinition":["sự định nghĩa lại","redefine success: định nghĩa lại thành công"],"metrics":["thước đo, tiêu chí đánh giá","traditional metrics: thước đo truyền thống"],"unprecedented speeds":["tốc độ chưa từng có","at unprecedented speeds"],"shattering limits":["phá vỡ những giới hạn","shatter limits / break boundaries"],"cutting-edge":["tiên tiến, hiện đại nhất","cutting-edge technological fields"],"push the envelope":["vượt giới hạn, thử nghiệm điều mới","push the envelope of possibilities"],"challenge outdated conventions":["thách thức các quy ước lạc hậu","challenge + noun"],"give up on":["từ bỏ, thôi hy vọng vào","give up on a dream"],"persist through":["kiên trì vượt qua","persist through challenges"],"personal and professional lives":["đời sống cá nhân và nghề nghiệp","personal and professional"],"unexpected setbacks":["trở ngại bất ngờ","face unexpected setbacks"],"kept moving forward":["tiếp tục tiến về phía trước","keep moving forward"],"unwavering determination":["quyết tâm không lay chuyển","unwavering + determination"],"humble beginnings":["xuất thân/khởi đầu khiêm tốn","start from humble beginnings"],"profound reverberations":["tác động lan rộng và sâu sắc","create profound reverberations"],"environmental degradation":["sự suy thoái môi trường","environmental degradation"],"butterfly effect":["hiệu ứng cánh bướm","small causes, significant consequences"],"ripple outward":["lan tỏa ra bên ngoài","decisions ripple outward"],"future generations":["các thế hệ tương lai","future generations will inherit"],"community gardens":["vườn cộng đồng","a community garden"],"raised their voices":["lên tiếng, bày tỏ tiếng nói","raise one’s voice"],"countless":["vô số, không đếm xuể","countless contributions"],"cascade effect":["hiệu ứng dây chuyền","trigger a cascade effect"],"ecological benefits":["lợi ích sinh thái","substantial ecological benefits"],"green innovators":["nhà đổi mới sáng tạo vì môi trường","green innovation"],"remarkable":["đáng chú ý, nổi bật","remarkable solutions"],"conserve natural resources":["bảo tồn tài nguyên thiên nhiên","conserve resources"],"carbon emissions":["lượng khí thải carbon","reduce carbon emissions"],"long-term environmental sustainability":["tính bền vững môi trường dài hạn","long-term sustainability"],"vertical farming":["canh tác theo chiều đứng","vertical farming techniques"],"conventional":["truyền thống, thông thường","conventional methods"],"renewable energy":["năng lượng tái tạo","powered by renewable energy"],"public skepticism":["sự hoài nghi của công chúng","public skepticism about technology"],"adoption rates":["tỷ lệ tiếp nhận/áp dụng","technology adoption rates"],"acceleration of green innovation":["sự tăng tốc của đổi mới xanh","acceleration of innovation"],"cultural heritage":["di sản văn hóa","preserve cultural heritage"],"passed down through generations":["được truyền qua nhiều thế hệ","pass down traditions"],"cultural keepers":["những người gìn giữ văn hóa","cultural keepers"],"walking a tightrope":["ở thế cân bằng khó khăn","walk a tightrope between A and B"],"embracing change":["đón nhận thay đổi","embrace change"],"disconnected from their roots":["mất liên hệ với cội nguồn","become disconnected from one’s roots"],"urbanization and globalization":["đô thị hóa và toàn cầu hóa","urbanization and globalization"],"digital archives":["kho lưu trữ số","digital archives"],"virtual museums":["bảo tàng ảo","virtual museums"],"active community engagement":["sự tham gia tích cực của cộng đồng","community engagement"],"cultural identity":["bản sắc văn hóa","maintain cultural identity"]}};
const ABC=['A','B','C','D'];
const byId=Object.fromEntries(DATA.questions.map(q=>[q.n,q]));
let answers={},submitted=false,showVI=false;
const $=id=>document.getElementById(id);
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function decorateArticle(s){
 // Vocabulary wrapping is applied to text nodes only, preserving source italics, underlines and headings.
 const entries=Object.keys(DATA.vocab).sort((a,b)=>b.length-a.length);
 const pat=new RegExp('(?<![\\w])('+entries.map(v=>v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\w])','gi');
 // Split on existing markup tags so text within attributes remains untouched.
 return String(s).split(/(<[^>]+>)/g).map(piece=>piece.startsWith('<')?piece:piece.replace(pat,m=>'<button type="button" class="vocab" data-vocab="'+escapeHTML(m.toLowerCase())+'" aria-label="Vocabulary '+escapeHTML(m)+'">'+escapeHTML(m)+'</button>')).join('');
}
function enhanceGaps(s){return s.replace(/\((\d{1,2})\)_{5,}/g,(_,n)=>'<span class="gap" data-gap="'+n+'" role="button" tabindex="0" aria-label="Go to Question '+n+'">('+n+')________</span>');}
function renderArticle(sec){if(!sec.paras.length)return '';
 const ps=sec.paras.map(([en,vi],i)=>'<p'+(i===sec.paras.length-1?' class="lastp"':'')+'>'+decorateArticle(enhanceGaps(en))+'</p><p class="translation" lang="vi">'+escapeHTML(vi)+'</p>').join('');
 return '<div class="article '+sec.slug+'">'+ps+'</div>';
}
function renderOrder(n){const lines=DATA.ordering[n];const beg=n===15?'<div class="letter-wrap"><p>Dear Maria,</p></div>':'';const tail=n===15?'<div class="letter-wrap"><p>Please visit me soon. I want to show you my new office.</p><p>Your friend, LK</p></div>':'';
 return beg+'<div class="order-lines">'+lines.map(([key,t])=>'<div class="order-line"><span class="letter">'+key+'.</span><span>'+escapeHTML(t)+'</span></div>').join('')+'</div>'+tail;
}
function renderQuestion(q){let n=q.n,order=n>=13&&n<=17;
 let prompt=order?'Question '+n+':':(n<23?'Question '+n+':':'Question '+n+': '+DATA.prompts[n]);
 const options=q.choices.map((opt,i)=>'<label class="option" data-answer="'+ABC[i]+'"><input type="radio" name="q'+n+'" value="'+ABC[i]+'" aria-label="Question '+n+', answer '+ABC[i]+'"><span class="opt-letter">'+ABC[i]+'.</span><span class="opt-text">'+escapeHTML(opt)+'</span></label>').join('');
 const islong=q.choices.some(s=>s.length>70) || n===18 || n===19 || n===20 || n===21 || n===22 || n===27 || n===28 || n===34 || n===35 || n===37 || n===38 || n===39 || n===40;
 return '<div class="question '+(order?'order-q':'')+'" id="q'+n+'" data-n="'+n+'"><div class="q-prompt"><strong>'+prompt.slice(0,('Question '+n+':').length)+'</strong>'+prompt.slice(('Question '+n+':').length)+'</div>'+(order?renderOrder(n):'')+'<div class="choices '+(islong?'long':'')+'">'+options+'</div><div class="feedback" id="fb'+n+'"></div></div>';
}
function render(){let content='';
 for(const sec of DATA.sections){let cl=(sec.start<=12?'cloze':'');
 content+='<section class="exam-section" id="sec-'+sec.slug+'"><div class="section-bar"><span class="section-tag">'+sec.label+'</span><span class="section-count">QUESTIONS '+sec.start+'—'+sec.end+'</span></div><p class="directions">'+escapeHTML(sec.intro)+'</p>'+(sec.paras.length?'<div class="reading-title">'+escapeHTML(sec.title)+'</div>'+renderArticle(sec):'')+'<div class="questions '+cl+'">'+DATA.questions.filter(q=>q.n>=sec.start&&q.n<=sec.end).map(renderQuestion).join('')+'</div></section>';
 }
 $('sections').innerHTML=content;
 document.querySelectorAll('.question input').forEach(input=>input.addEventListener('change',onChoose));
 document.querySelectorAll('[data-gap]').forEach(gap=>{
  const jump=()=>{const t=$('q'+gap.dataset.gap);if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.querySelector('input')?.focus({preventScroll:true});}};
  gap.addEventListener('click',jump);gap.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();jump();}});
 });
 document.querySelectorAll('.vocab').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();openPop(el);}));
 updateProgress();
}
function onChoose(ev){if(submitted)return;let input=ev.target;let n=Number(input.name.slice(1));answers[n]=input.value;$('q'+n).classList.add('answered');updateProgress();fillGap(n);}
function fillGap(n){document.querySelectorAll('[data-gap="'+n+'"]').forEach(el=>{const v=answers[n];el.textContent=v?'('+n+') '+byId[n].choices[ABC.indexOf(v)]:'('+n+')________';el.classList.toggle('filled',!!v);});}
function updateProgress(){let amount=Object.keys(answers).length;$('count').textContent=amount+' / 40 answered';$('progress').style.width=(100*amount/40)+'%';}
function closePop(){$('vocabPop').classList.remove('open');}
function openPop(el){let key=el.dataset.vocab.toLowerCase();let note=DATA.vocab[key];if(!note){const found=Object.keys(DATA.vocab).find(x=>x.toLowerCase()===key);note=DATA.vocab[found];}
 if(!note)return;
 $('popTitle').textContent=el.textContent;$('popMeaning').textContent=note[0];$('popExample').textContent=note[1];const pop=$('vocabPop');pop.classList.add('open');
 let rect=el.getBoundingClientRect();let top=rect.bottom+8,left=Math.min(window.innerWidth-380,Math.max(12,rect.left));
 if(left<12)left=12;
 if(top+170>innerHeight)top=Math.max(8,rect.top-174);
 pop.style.top=top+'px';pop.style.left=left+'px';
}
function submit(){if(submitted){$('result').scrollIntoView({behavior:'smooth'});return;}
 const remaining=40-Object.keys(answers).length;if(remaining>0&&!window.confirm('You have '+remaining+' unanswered question'+(remaining===1?'':'s')+'. Submit now?'))return;
 submitted=true;let correct=0,wrong=[];
 DATA.questions.forEach(q=>{const actual=answers[q.n],ok=actual===q.answer;if(ok)correct++;else wrong.push(q.n);
 const el=$('q'+q.n);el.classList.add('graded',ok?'right':'wrong');el.querySelectorAll('input').forEach(i=>i.disabled=true);
 el.querySelectorAll('.option').forEach(x=>{if(x.dataset.answer===q.answer)x.classList.add('correct-choice');if(actual===x.dataset.answer&&!ok)x.classList.add('bad-choice');});
 const evidence=q.evidence?'<div class="fb-evidence">'+escapeHTML(q.evidence)+'</div>':'';
 const caveat=[11,12,27,32,33].includes(q.n)?'<div class="uncertain">Teacher note: Câu này có điểm cần lưu ý khi đối chiếu đáp án/diễn đạt gốc; xem giải thích.</div>':'';
 $('fb'+q.n).innerHTML='<div class="fb-head">'+(ok?'✓ Correct':'✕ '+(actual?'Incorrect':'Not answered'))+' · Suggested answer: '+q.answer+'</div><div lang="vi">'+escapeHTML(q.explain)+'</div>'+evidence+caveat;
 });
 const score=(correct/40*10).toFixed(2).replace(/\.00$/,'');
 const wrongStr=wrong.length?wrong.join(', '):'None';
 const result=$('result');result.innerHTML='<div class="result-h">SUBMITTED · RESULT</div><div class="score-line"><div class="score-main">'+correct+' / 40</div><div class="score-note">'+score+' / 10 points · '+(40-correct)+' incorrect / unanswered</div></div><div class="score-note">Review questions: '+wrongStr+'</div><div class="disclaimer" lang="vi">Đáp án được suy luận từ chính đề trong ảnh, không phải đáp án chính thức của người ra đề. Câu 11, 12 (và một số câu diễn đạt gần nghĩa) có thể cần giáo viên đối chiếu. Câu 32 ghi sai số đoạn ngay trong bản gốc.</div><div class="result-actions"><button type="button" class="small-btn primary" id="reviewFirst">'+(wrong.length?'Review first mistake':'Review answers')+'</button><button type="button" class="small-btn" id="tryAgain">Try again</button><button type="button" class="small-btn" id="printResult">Print</button></div>';
 result.classList.add('visible');$('submitTop').textContent='Result';$('submitBottom').textContent='See result';$('submitBottom').disabled=false;
 $('reviewFirst').addEventListener('click',()=>{let target=$('q'+(wrong[0]||1));target?.scrollIntoView({behavior:'smooth',block:'start'});});
 $('tryAgain').addEventListener('click',()=>reset(true));$('printResult').addEventListener('click',()=>window.print());
 window.scrollTo({top:0,behavior:'smooth'});
}
function reset(skipConfirm=false){if(!skipConfirm&&(submitted||Object.keys(answers).length)&&!window.confirm('Clear all answers and start again?'))return;
 answers={};submitted=false;$('result').classList.remove('visible');$('result').innerHTML='';$('submitTop').textContent='Submit';$('submitBottom').textContent='Submit answers';
 document.querySelectorAll('.question').forEach(el=>{el.classList.remove('graded','wrong','right','answered');el.querySelectorAll('input').forEach(i=>{i.checked=false;i.disabled=false});el.querySelectorAll('.option').forEach(opt=>opt.classList.remove('correct-choice','bad-choice'));el.querySelector('.feedback').innerHTML='';});
 document.querySelectorAll('[data-gap]').forEach(el=>{let n=el.dataset.gap;el.textContent='('+n+')________';el.classList.remove('filled');});updateProgress();window.scrollTo({top:0,behavior:'smooth'});
}
$('viToggle').addEventListener('click',()=>{showVI=!showVI;document.body.classList.toggle('show-vi',showVI);$('viToggle').textContent='VI · '+(showVI?'ON':'OFF');$('viToggle').setAttribute('aria-pressed',String(showVI));});
$('submitTop').addEventListener('click',submit);$('submitBottom').addEventListener('click',submit);$('reset').addEventListener('click',()=>reset());$('printBtn').addEventListener('click',()=>window.print());$('popClose').addEventListener('click',closePop);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop();});document.addEventListener('click',e=>{if(!e.target.closest('.vocab-pop')&&!e.target.closest('.vocab'))closePop();});window.addEventListener('scroll',closePop,{passive:true});window.addEventListener('resize',closePop);
render();
</script>
